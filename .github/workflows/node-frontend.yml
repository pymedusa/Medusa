name: Frontend tests

permissions:
  contents: read

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
        cache-dependency-path: themes-default/slim/yarn.lock
    - name: Install themes dependencies
      working-directory: ./themes-default/slim
      run: yarn install --ignore-scripts
    - name: Check themes builds
      run: |
        mv ./.github/build-themes-check.sh ./themes-default/slim
        cd ./themes-default/slim
        bash build-themes-check.sh
    - name: Test lint
      working-directory: ./themes-default/slim
      run: yarn lint && yarn lint-css
    - name: Test build
      working-directory: ./themes-default/slim
      run: yarn test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
