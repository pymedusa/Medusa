name: Frontend tests

permissions:
  contents: read

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
    - name: Discover Yarn cache directory
      id: yarn-cache-info
      working-directory: ./themes-default/slim
      shell: bash
      run: |
        yarn_cache_dir="$(yarn cache dir)"
        yarn_version="$(yarn --version)"
        printf 'directory=%s\n' "$yarn_cache_dir" >> "$GITHUB_OUTPUT"
        printf 'version=%s\n' "$yarn_version" >> "$GITHUB_OUTPUT"
    - name: Cache Yarn downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache-info.outputs.directory }}
        key: medusa-yarn-v1-${{ runner.os }}-${{ runner.arch }}-yarn-${{ steps.yarn-cache-info.outputs.version }}-${{ hashFiles('themes-default/slim/package.json', 'themes-default/slim/yarn.lock', 'themes-default/slim/.yarnrc', 'themes-default/slim/.yarnrc.yml') }}
    - name: Install themes dependencies
      working-directory: ./themes-default/slim
      run: yarn install --ignore-scripts
    - name: Check themes builds
      run: |
        mv ./.github/build-themes-check.sh ./themes-default/slim
        cd ./themes-default/slim
        bash build-themes-check.sh
    - name: Test lint
      working-directory: ./themes-default/slim
      run: yarn lint && yarn lint-css
    - name: Test build
      working-directory: ./themes-default/slim
      run: yarn test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
