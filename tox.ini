[tox]
skipsdist = true
envlist =
    py{310,311,312,313}
    lint

[gh-actions]
python =
    3.10: py310, lint
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
deps = 
    pytest
    -rtest_requirements.txt
commands =
    python setup.py test -a "{posargs:tests} --cov=medusa --cov-report=xml"

[testenv:lint]
deps = 
    pytest
    -rtest_requirements.txt
commands =
    python setup.py test -a "medusa --flake8"
